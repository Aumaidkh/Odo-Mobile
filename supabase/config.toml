# Supabase CLI project config.
#
# Only what this repo actually relies on. Everything else keeps the CLI's defaults — a config
# that restates them drifts from them silently on the next CLI upgrade.
#
# `project_id` is the local Docker stack's name, not the hosted project ref.
project_id = "odo"

# The schemas PostgREST answers for.
#
# `social` is not decoration: the pipeline's edge functions reach social.content_queue and
# friends over REST with the service role, and without it they answer `Invalid schema: social`
# — which is exactly what dev did while production, configured by hand, worked.
#
# Exposing it hands a browser nothing. Those tables have RLS on with no policies, so an
# anonymous or signed-in read returns no rows; the admin panel reads them through `public`
# views that carry their own permission check.
#
# Here rather than in the dashboard so the two projects cannot drift again.
[api]
schemas = ["public", "graphql_public", "social"]

[functions.legal]
# The Terms, the Privacy Policy and the account-deletion page. All three have to be readable
# by anyone with the link — a Play reviewer, or somebody who has already uninstalled the app —
# so there is no Supabase token to verify. The one endpoint that acts on anything, the POST
# behind the deletion button, authenticates its own caller with a Firebase ID token.
verify_jwt = false

[functions.firebase-session]
# The caller is signing in and has no Supabase token yet, so there is nothing to verify. The
# function does its own authentication instead: it will not act on anything that is not a
# valid, unexpired Firebase ID token for this project, carrying a phone claim.
verify_jwt = false

[functions.admin-session]
# Same as its two siblings: the caller is signing in and has no Supabase token yet. It does
# its own authentication — a valid, unexpired Firebase ID token for one of our projects,
# carrying an email that is in `admin_users` with is_active.
#
# Pinned here rather than left to `--no-verify-jwt` on the command line, because the toggle
# has a habit of switching itself back on when a function is updated and nothing announces it
# (see supabase/check-legal.sh). A deploy that forgets the flag would turn every sign-in into
# a 401 with no clue why.
verify_jwt = false

[functions.blog-session]
# Same as its siblings: the caller is signing in and has no Supabase token yet, so it does its
# own authentication — a valid, unexpired Firebase ID token carrying an email that is in
# `blog_authors`.
#
# This entry was missing while the function ran only on production, where it had been deployed
# with `--no-verify-jwt` by hand. Absent from this file it defaults to *on*, so the first
# deploy to a new project turns every author sign-in into a 401 that says nothing about why.
verify_jwt = false

[functions.admin-config]
# Unlike the three session functions, the caller here is already signed in, so the platform's
# own JWT check is exactly the right gate — and the function then asks admin_has('flags.write')
# as the caller on top, because a valid session is not a permission.
verify_jwt = true

[functions.admin-invite]
# Like admin-config: the caller is already signed in, so the platform's own JWT check is the
# right gate — and the function then insists on admin_has('admin.roles.write') on top, because
# a valid session is not a permission.
verify_jwt = true

[functions.blog-rebuild]
# The caller is an author who is already signed in, so the platform's own JWT check is
# exactly the right gate — and the function then insists on the blog_author claim on top,
# because any app account has a valid token and no business redeploying the website.
verify_jwt = true

[functions.advisory-classify]
# The caller is a signed-in owner checking their own bill, so the platform's own JWT check is
# the right gate — and it is also what identifies them, because the spend meter is per owner
# and an unattributed call cannot be capped.
verify_jwt = true
