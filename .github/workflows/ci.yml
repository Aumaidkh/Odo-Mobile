name: CI

# The gate every pull request has to pass before it can be squash-merged, and the
# gate every push to a release branch has to pass after it has landed.
# Everything here is JVM-only and finishes in minutes; the on-device tests live
# in instrumented-tests.yml because they are too slow to sit on every PR.
on:
  pull_request:
    branches: [master, develop, 'releases/**']
  # Release branches are also gated on push. Fixes land on them directly during a
  # stabilisation window, and a broken release branch is found late otherwise —
  # nothing else builds it until the merge back to master.
  push:
    branches: ['releases/**']
  # Build any branch on demand. Feature branches only reach CI through a PR, so without
  # this there is no way to get an APK for a branch that has not opened one yet — which
  # is exactly what the odo-e2e suite asks for when it is pointed at a branch.
  workflow_dispatch:
    inputs:
      realPhoneAuth:
        description: "Real phone sign-in (needed for the E2E suite). Off uses the fixed development account."
        type: boolean
        default: true

# A new push to the same PR makes the in-flight run obsolete — cancel it rather
# than paying for a result nobody will read. On a push there is no PR number, so
# the branch ref groups the runs instead.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A GitHub runner has 7 GB of RAM. gradle.properties asks for a 4 GB Gradle
  # daemon plus a 3 GB Kotlin daemon, which together outgrow the runner and get
  # the compiler OOM-killed. Trim both for CI only — local builds keep theirs.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx1536m

jobs:
  # ---------------------------------------------------------------------------
  # The PR title becomes the squash commit message, so it is held to the same
  # Conventional Commit rules as a commit subject (docs/VCS_CONVENTIONS.md).
  # ---------------------------------------------------------------------------
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    # A push has no PR title to check. Without this the job fails on every push to a
    # release branch rather than being skipped.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commit format
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            ci
            perf
            build
            style
            revert
          # Scope is encouraged but optional, per the conventions doc.
          requireScope: false
          # Imperative, lowercase, no trailing period, <= 50 chars.
          subjectPattern: ^(?![A-Z])(?!.*\.$).{1,50}$
          subjectPatternError: >-
            The subject "{subject}" of PR title "{title}" is invalid: it must
            start lowercase, carry no trailing period, and stay within 50
            characters (docs/VCS_CONVENTIONS.md).

  # ---------------------------------------------------------------------------
  # Unit tests: every module's commonTest + androidHostTest, on the JVM.
  # `testAndroidHostTest` unqualified runs it in all 25 modules that have it;
  # `allTests` is deliberately avoided because it drags in the iOS targets.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The results publisher writes a check run and comments the summary.
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run unit tests
        run: ./gradlew testAndroidHostTest

      - name: Publish test summary
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          check_name: Unit test results
          files: '**/build/test-results/testAndroidHostTest/*.xml'
          # A push has nothing to comment on; the check run alone carries the result.
          comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}

      # Published on every run, not only on failure: a green run's report is the
      # record of what was actually exercised.
      - name: Upload test reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testAndroidHostTest/**
            **/build/test-results/testAndroidHostTest/*.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Compile gate: the whole graph has to produce an installable APK, and the
  # APK is published so a change can be tried on a device without building it.
  # ---------------------------------------------------------------------------
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Firebase and Supabase credentials live on this environment rather than at repo
    # level (deploy-internal.yml is the other consumer). It has no protection rules and no
    # branch policy, so naming it here adds no gate — only access to the two secrets that
    # decide whether this APK is usable. Moving them to repo-level secrets would let this
    # line go away; it needs someone who can read the values to re-enter them.
    environment: play-internal
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6.2.0

      # Firebase phone auth, Crashlytics and Performance all need this, and it is
      # gitignored because it names a specific Firebase project.
      #
      # Two files, because a debug build installs under a suffixed applicationId and the
      # Google Services plugin needs a client registered for exactly that — it does not
      # fall back to one registered for the base id. A local checkout has both: the root
      # file for release, and androidApp/src/debug/google-services.json, which the plugin
      # prefers for this build type. CI needs the same pair.
      #
      # The root file is still written even though the debug one is what gets read, because
      # androidApp/build.gradle.kts only applies the plugin at all when the root file
      # exists.
      #
      # A missing or unusable secret degrades to the unconfigured APK this job used to
      # always produce, rather than failing. This is the compile gate on every pull request:
      # a fork PR gets no secrets, and a Firebase registration nobody has done yet must not
      # turn every PR red for a reason unrelated to the change under review.
      - name: Write google-services.json
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_DEBUG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
        run: |
          set -u
          app_id="$(sed -n 's/^odo-applicationId = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          suffix="$(sed -n 's/^odo-debugApplicationIdSuffix = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          debug_id="$app_id$suffix"

          give_up() {
            echo "::warning::$1 Building without Firebase — sign-in, Crashlytics and Performance will be inert in this APK."
            rm -f androidApp/google-services.json androidApp/src/debug/google-services.json
            echo "configured=false" >> "$GITHUB_OUTPUT"
          }

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" ]; then
            give_up "GOOGLE_SERVICES_JSON_BASE64 and GOOGLE_SERVICES_JSON_DEBUG_BASE64 are both required; at least one is unset."
            exit 0
          fi

          mkdir -p androidApp/src/debug
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          echo "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" | base64 --decode > androidApp/src/debug/google-services.json

          # Only the debug file is checked against an id: it is the one this build reads.
          # The root file is checked for being readable JSON at all, since a truncated
          # secret there fails later and less clearly.
          if ! python3 .github/scripts/check_google_services.py \
                 androidApp/google-services.json "$app_id"; then
            give_up "The root google-services.json is unusable or does not cover $app_id."
            exit 0
          fi
          if ! python3 .github/scripts/check_google_services.py \
                 androidApp/src/debug/google-services.json "$debug_id"; then
            give_up "No client for $debug_id. Register the debug app in the Firebase console, re-download its google-services.json, and set it as GOOGLE_SERVICES_JSON_DEBUG_BASE64."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        id: assemble
        env:
          # infrastructure/supabase/build.gradle.kts reads local.properties first and these
          # env vars second. A runner has no local.properties, so this is the only way the
          # credentials reach the build — without them SupabaseEnvironment.isConfigured is
          # false and the whole remote layer is replaced by offline fakes.
          #
          # The _DEV suffix is not decoration. A debug build resolves to the development
          # Supabase project (generateSupabaseConfig: buildFlavor != release -> isDev), and
          # isDev appends _DEV to the variable it looks for. Setting the unsuffixed
          # SUPABASE_URL here would be read by nothing and would quietly produce the same
          # unconfigured APK this change exists to stop — while also being the production
          # project, which no test run should be writing into.
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          # Same suffix rule, from infrastructure/billing/build.gradle.kts. Optional: without
          # it the paywall falls back to its unconfigured state, which no E2E spec asserts on.
          REVENUECAT_API_KEY_ANDROID_TEST: ${{ secrets.REVENUECAT_API_KEY_ANDROID_TEST }}
          # Real phone sign-in rather than the fixed development account. The E2E suite signs
          # in with Firebase test numbers, and those only exist on the real path.
          SUPABASE_PHONE_AUTH: ${{ github.event.inputs.realPhoneAuth == 'false' && 'false' || 'true' }}
        run: |
          if [ -n "$SUPABASE_URL_DEV" ] && [ -n "$SUPABASE_ANON_KEY_DEV" ]; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SUPABASE_URL_DEV / SUPABASE_ANON_KEY_DEV — sync and sign-in will not work in this APK."
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew :androidApp:assembleDebug

      # Travels inside the artifact, so an APK found weeks later still says whether it can
      # sign in. Without it the only way to find out is to install it and watch sign-in
      # fail, which is how a whole afternoon goes.
      - name: Describe the build
        run: |
          cat > androidApp/build/outputs/apk/debug/BUILD_CONFIG.txt <<INFO
          commit     ${{ github.sha }}
          ref        ${{ github.ref_name }}
          run        ${{ github.run_id }}
          run url    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          firebase   ${{ steps.firebase.outputs.configured }}
          supabase   ${{ steps.assemble.outputs.supabase }}
          phoneAuth  ${{ github.event.inputs.realPhoneAuth == 'false' && 'false' || 'true' }}
          INFO
          cat androidApp/build/outputs/apk/debug/BUILD_CONFIG.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: odo-debug-apk
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/debug/BUILD_CONFIG.txt
          # 90 days, the maximum. Artifact storage is free on a public repository, so a
          # shorter window buys nothing and costs the ability to re-test an older build.
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android Lint across the app and every module it depends on. Today's issues
  # are frozen in androidApp/lint-baseline.xml, so only NEW ones fail the PR.
  # ---------------------------------------------------------------------------
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run lint
        run: ./gradlew :androidApp:lintDebug

      - name: Upload lint report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lint-report
          path: |
            androidApp/build/reports/lint-results-debug.html
            androidApp/build/reports/lint-results-debug.xml
          retention-days: 7
          if-no-files-found: warn
