<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Gotham,Inter,'Helvetica Neue',Arial,sans-serif;background:#000}</style>
</head>
<body>

<!-- Variant A · STAT — 400×500, export @2.7x = 1080×1350. Design source: Social Templates.dc.html (IG 1) -->
<div id="stat-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 22% 12%, #1F1F1F 0%, #141414 48%, #000000 100%);display:flex;flex-direction:column;justify-content:space-between;padding:34px 34px 30px">
  <div style="display:flex;align-items:center;gap:9px"><svg width="22" height="22" viewBox="0 0 212 212"><circle cx="106" cy="106" r="66" fill="none" stroke="#262626" stroke-width="26" stroke-linecap="round" stroke-dasharray="311 415" transform="rotate(135 106 106)"/><circle cx="106" cy="106" r="66" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-dasharray="233 415" transform="rotate(135 106 106)"/></svg><span style="font-size:11.5px;font-weight:700;letter-spacing:1.8px;color:#FFFFFF">ODO</span></div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <span style="font-size:38px;font-weight:700;color:#FFFFFF;letter-spacing:-1.6px;line-height:1.12">{{HEADLINE}}</span>
    <div style="display:flex;gap:11px">{{STATS_CHIPS}}</div>
  </div>
  <span style="font-size:14px;color:#9CA3AF">{{FOOTER}}</span>
</div>

<!-- Variant B · SCREENSHOT — light panel. Design source: Social Templates.dc.html (IG 2) -->
<div id="shot-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 24% 10%, #FFFFFF 0%, #F4F4F4 52%, #D8D8D8 100%);display:flex">
  <div style="flex:1;padding:32px 0 32px 30px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 212 212"><circle cx="106" cy="106" r="66" fill="none" stroke="#D8D8D8" stroke-width="26" stroke-linecap="round" stroke-dasharray="311 415" transform="rotate(135 106 106)"/><circle cx="106" cy="106" r="66" fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-dasharray="233 415" transform="rotate(135 106 106)"/></svg><span style="font-size:11px;font-weight:700;letter-spacing:1.6px;color:#000000">ODO</span></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:30px;font-weight:700;color:#000000;letter-spacing:-1.2px;line-height:1.1">{{HEADLINE}}</span>
      <span style="font-size:14.5px;color:#374151;line-height:1.45;max-width:170px">{{FOOTER}}</span>
    </div>
    <span style="font-size:12.5px;font-weight:700;color:#000000;background:#D8D8D8;padding:8px 14px;border-radius:999px;align-self:flex-start">{{CTA}}</span>
  </div>
  <div style="width:172px;padding:40px 0 0;display:flex;align-items:flex-end">
    <div style="width:100%;height:88%;border-radius:24px 0 0 0;overflow:hidden;background:#000000;border:1px solid #D8D8D8;border-right:none;border-bottom:none"><img src="{{SCREENSHOT_SRC}}" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  </div>
</div>

</body>
</html>
