<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Gotham,Inter,'Helvetica Neue',Arial,sans-serif;background:#000}</style>
</head>
<body>

<!-- Carousel slides — 400×500 each, export @2.7x = 1080×1350 (4:5).
     One card per slide type; the renderer fills the tokens for a single slide and
     screenshots only that card's selector. Design source: Social Templates.html
     (INSTAGRAM CAROUSEL · 1080×1350, slides 01–05). -->

<!-- COVER · pattern interrupt. Progress bar + swipe cue bottom. -->
<div id="cover-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:#000000;display:flex;flex-direction:column;justify-content:space-between;padding:34px">
  <div style="display:flex;align-items:center;gap:9px"><svg width="22" height="22" viewBox="0 0 212 212"><circle cx="106" cy="106" r="66" fill="none" stroke="#262626" stroke-width="26" stroke-linecap="round" stroke-dasharray="311 415" transform="rotate(135 106 106)"/><circle cx="106" cy="106" r="66" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-dasharray="233 415" transform="rotate(135 106 106)"/></svg><span style="font-size:11.5px;font-weight:700;letter-spacing:1.8px;color:#FFFFFF">ODO</span></div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <span style="font-size:38px;font-weight:700;color:#FFFFFF;letter-spacing:-1.7px;line-height:1.1">{{C_HEADLINE}}</span>
    <span style="font-size:15px;color:#9CA3AF;line-height:1.45">{{C_SUB}}</span>
  </div>
  <div style="display:flex;align-items:flex-end;gap:12px">
    <div style="display:flex;gap:6px;flex:1;align-items:center">{{PROGRESS}}</div>
    <div style="display:flex;align-items:center;gap:7px"><span style="font-size:12.5px;font-weight:700;color:#9CA3AF;letter-spacing:0.4px">SWIPE</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
</div>

<!-- DARK · hidden problem / curiosity gap. Headline + optional rows card + footer. -->
<div id="dark-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 22% 12%, #1F1F1F 0%, #141414 48%, #000000 100%);display:flex;flex-direction:column;justify-content:space-between;padding:34px">
  <span style="font-size:11px;font-weight:700;letter-spacing:1.6px;color:#9CA3AF">SLIDE {{SLIDE_NO}}</span>
  <div style="display:flex;flex-direction:column;gap:16px">
    <span style="font-size:30px;font-weight:700;color:#FFFFFF;letter-spacing:-1.2px;line-height:1.14">{{C_HEADLINE}}</span>
    {{ROWS}}
  </div>
  <span style="font-size:14.5px;color:#9CA3AF;line-height:1.45">{{C_FOOTER}}</span>
</div>

<!-- STATS · consequence. Two numbers, no adjectives. -->
<div id="stats-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:#000000;display:flex;flex-direction:column;justify-content:space-between;padding:34px">
  <span style="font-size:11px;font-weight:700;letter-spacing:1.6px;color:#9CA3AF">SLIDE {{SLIDE_NO}}</span>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:#9CA3AF">{{K1}}</span>
      <span style="font-size:40px;font-weight:700;color:#FFFFFF;letter-spacing:-1.9px;line-height:1.0">{{V1}}</span>
    </div>
    <div style="height:1px;background:#262626"></div>
    <div style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:#B91C1C">{{K2}}</span>
      <span style="font-size:40px;font-weight:700;color:#FFFFFF;letter-spacing:-1.9px;line-height:1.0">{{V2}}</span>
    </div>
  </div>
  <span style="font-size:14.5px;color:#9CA3AF;line-height:1.45">{{C_FOOTER}}</span>
</div>

<!-- ACTION · light panel, the saveable slide. Numbered steps. -->
<div id="action-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 24% 10%, #FFFFFF 0%, #F4F4F4 52%, #D8D8D8 100%);display:flex;flex-direction:column;justify-content:space-between;padding:34px">
  <span style="font-size:11px;font-weight:700;letter-spacing:1.6px;color:#6B7280">SLIDE {{SLIDE_NO}}</span>
  <div style="display:flex;flex-direction:column;gap:16px">
    <span style="font-size:30px;font-weight:700;color:#000000;letter-spacing:-1.2px;line-height:1.1">{{C_HEADLINE}}</span>
    <div style="display:flex;flex-direction:column;gap:11px">{{STEPS}}</div>
  </div>
  <span style="font-size:14px;color:#374151;line-height:1.45">{{C_FOOTER}}</span>
</div>

<!-- ODO · the only slide that mentions the product. CTA pill + progress bar. -->
<div id="odo-card" style="width:400px;height:500px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 50% 30%, #1F1F1F 0%, #141414 46%, #000000 100%);display:flex;flex-direction:column;justify-content:space-between;padding:34px">
  <div style="display:flex;align-items:center;gap:9px"><svg width="22" height="22" viewBox="0 0 212 212"><circle cx="106" cy="106" r="66" fill="none" stroke="#262626" stroke-width="26" stroke-linecap="round" stroke-dasharray="311 415" transform="rotate(135 106 106)"/><circle cx="106" cy="106" r="66" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-dasharray="233 415" transform="rotate(135 106 106)"/></svg><span style="font-size:11.5px;font-weight:700;letter-spacing:1.8px;color:#FFFFFF">ODO</span></div>
  <div style="display:flex;flex-direction:column;gap:15px">
    <span style="font-size:30px;font-weight:700;color:#FFFFFF;letter-spacing:-1.2px;line-height:1.12">{{C_HEADLINE}}</span>
    {{ROWS}}
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="background:#FFFFFF;border-radius:999px;padding:12px 24px"><span style="font-size:14.5px;font-weight:700;color:#000000">{{CTA}}</span></div>
    <div style="display:flex;gap:6px;align-items:center">{{PROGRESS}}</div>
  </div>
</div>

</body>
</html>
